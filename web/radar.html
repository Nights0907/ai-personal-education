<div class="radar-heading"><div><span class="radar-eyebrow">PERSONALIZED PRACTICE</span><h1>题目雷达</h1><p class="muted">找到薄弱的一点，用一道新题，把理解练扎实。</p></div><button id="generate" type="button">✦ 魔法棒出题</button></div>
