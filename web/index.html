<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>沐斯 AI · 数字人教师</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div id="app">

  <!-- ========== 侧边栏 ========== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-mark">沐</div>
        <div class="brand-text">
          <div class="brand-name">沐斯 AI</div>
          <div class="brand-sub">你的数学学习伙伴</div>
        </div>
      </div>
      <button class="btn-new-chat" id="btnNewChat" title="新对话">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        新对话
      </button>
    </div>

    <div class="sidebar-scroll">
      <div class="side-section">
        <div class="side-label">会话</div>
        <div id="sessionList" class="session-list"></div>
      </div>

      <div class="side-section">
        <div class="side-label">学习中心</div>
        <button class="side-item" data-panel="problems">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3 2.5h7.5L13 5v8.5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-10a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.3"/><path d="M5.5 7h5M5.5 9.5h5M5.5 12h3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          我的题目
          <span class="side-count" id="problemCount">0</span>
        </button>
        <button class="side-item" data-panel="profile">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="5.5" r="2.5" stroke="currentColor" stroke-width="1.3"/><path d="M2.5 13.5c.8-2.4 3-3.5 5.5-3.5s4.7 1.1 5.5 3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          学习档案
        </button>
      </div>
    </div>

    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="user-avatar">生</div>
        <div class="user-meta">
          <div class="user-name">学习中的你</div>
          <div class="user-tag">文字 / 拍照 · 解答自动保存</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- 移动端遮罩 -->
  <div class="sidebar-mask" id="sidebarMask"></div>

  <!-- ========== 主区域 ========== -->
  <main class="main">

    <header class="topbar">
      <button class="icon-btn menu-btn" id="btnMenu" title="菜单">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <div class="topbar-title" id="topbarTitle">新对话</div>
      <div class="topbar-right"><a class="memory-entry" href="memory.html">▤ 长期记忆</a>
        <a class="history-entry" id="btnConversationHistory" href="conversation.html" title="查看当前会话的完整消息和历史摘要">会话记录 <span aria-hidden="true">↗</span></a>
        <span class="phase-pill">高中数学 · 一起进步</span>
      </div>
    </header>

    <div class="chat-scroll" id="chatScroll">
      <div class="chat-inner" id="chatInner"><!-- 消息渲染区 --></div>
    </div>

    <!-- ========== 输入区 ========== -->
    <div class="composer-wrap">
      <div class="composer">
        <!-- 附件预览 -->
        <div class="attach-preview" id="attachPreview" hidden>
          <div class="attach-thumb">
            <img id="attachImg" alt="题目照片预览">
            <button class="attach-remove" id="attachRemove" title="移除图片">×</button>
            <div class="attach-name" id="attachName"></div>
          </div>
          <div class="attach-hint">请上传清晰完整的单题照片（题目不依赖配图）</div>
        </div>

        <textarea id="input" rows="1"
          placeholder="把题目写在这里，或点击相机上传照片…"></textarea>

        <div class="composer-bar">
          <div class="composer-left">
            <button class="icon-btn" id="btnAttach" title="上传单题照片（JPG / PNG / WebP，最大 5MB）">
              <svg width="17" height="17" viewBox="0 0 16 16" fill="none"><path d="M2.5 5.5A1.5 1.5 0 0 1 4 4h1.2l.9-1.4A1 1 0 0 1 7 2h2a1 1 0 0 1 .9.6l.9 1.4H12a1.5 1.5 0 0 1 1.5 1.5v6A1.5 1.5 0 0 1 12 13H4a1.5 1.5 0 0 1-1.5-1.5v-6z" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8.3" r="2.2" stroke="currentColor" stroke-width="1.3"/></svg>
            </button>
            <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" hidden>

            <div class="mode-switch" id="modeSwitch" role="tablist">
              <button class="mode-btn active" data-mode="solve" role="tab">直接解答</button>
              <button class="mode-btn" data-mode="guide" role="tab" title="一步步引导你思考，最终呈现答案">引导学习</button>
            </div>
          </div>
          <div class="composer-right">
            <span class="char-hint" id="charHint"></span>
            <button class="btn-send" id="btnSend" disabled title="发送">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M8 13V3M8 3L3.5 7.5M8 3l4.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
      </div>
      <div class="composer-foot">
        解答自动保存 · 照片限 5MB，题目需不依赖配图 · Enter 发送，Shift+Enter 换行
      </div>
    </div>
  </main>

  <!-- ========== 我的题目 抽屉 ========== -->
  <aside class="drawer" id="problemDrawer">
    <div class="drawer-header">
      <div class="drawer-title">我的题目</div>
      <button class="icon-btn" id="btnCloseDrawer" title="关闭">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3.5 3.5l9 9m0-9l-9 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="drawer-filters">
      <input class="filter-input" id="problemSearch" placeholder="搜索题干关键词…">
      <div class="filter-chips" id="problemTypeChips">
        <button class="chip active" data-type="all">全部</button>
        <button class="chip" data-type="选择">选择</button>
        <button class="chip" data-type="填空">填空</button>
        <button class="chip" data-type="解答">解答</button>
      </div>
    </div>
    <div class="drawer-list" id="problemList"></div>
  </aside>

  <!-- toast -->
  <div class="toast" id="toast" hidden></div>
</div>

<link rel="stylesheet" href="vendor/katex.css">
<script src="vendor/marked.js"></script>
<script src="vendor/purify.js"></script>
<script src="vendor/katex.js"></script>
<script src="vendor/math.js"></script>
<script src="chrome.js"></script><script src="app.js"></script>
</body>
</html>
