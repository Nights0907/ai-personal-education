<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>学习档案 · 沐斯 AI</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="profile.css">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div id="app">

  <!-- ========== 侧边栏（与主界面一致） ========== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-mark">沐</div>
        <div class="brand-text">
          <div class="brand-name">沐斯 AI</div>
          <div class="brand-sub">数字人教师 · 高中数学</div>
        </div>
      </div>
      <a class="btn-new-chat" href="/" title="返回对话">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M4 3h8l1 1v8l-1 1H4l-1-1V4l1-1z" stroke="currentColor" stroke-width="1.3"/><path d="M8 5v6M5.5 8h5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        新对话
      </a>
    </div>

    <div class="sidebar-scroll">
      <div class="side-section">
        <div class="side-label">学习中心</div>
        <a class="side-item" href="/">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3 2.5h7.5L13 5v8.5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-10a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.3"/><path d="M5.5 7h5M5.5 9.5h5M5.5 12h3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          我的题目
        </a>
        <a class="side-item active" href="/profile.html">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="5.5" r="2.5" stroke="currentColor" stroke-width="1.3"/><path d="M2.5 13.5c.8-2.4 3-3.5 5.5-3.5s4.7 1.1 5.5 3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          学习档案
        </a>
      </div>
    </div>

    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="user-avatar" id="sideAvatar">生</div>
        <div class="user-meta">
          <div class="user-name" id="sideName">学生</div>
          <div class="user-tag">个性化学习档案</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- ========== 主区域 ========== -->
  <main class="main">
    <header class="topbar">
      <a class="icon-btn" href="/" title="返回对话" style="display:inline-flex;align-items:center;justify-content:center">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3.5L5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div class="topbar-title">学习档案</div>
      <div class="topbar-right"><a class="memory-entry" href="memory.html">▤ 长期记忆</a>
        <span class="phase-pill" id="profileStatus">加载中…</span>
      </div>
    </header>

    <div class="profile-scroll">
      <div class="profile-inner">

        <!-- 加载失败提示 -->
        <div class="profile-error" id="profileError" hidden></div>

        <!-- ===== 顶部：学生概览 ===== -->
        <section class="profile-hero">
          <div class="hero-avatar" id="heroAvatar">生</div>
          <div class="hero-main">
            <h1 id="heroName">学生</h1>
            <div class="hero-meta">
              <span class="hero-tag" id="heroGrade">未填写年级</span>
              <span class="hero-tag" id="heroUpdated">—</span>
            </div>
          </div>
          <div class="hero-stats">
            <div class="hstat">
              <div class="hstat-value" id="statAreas">0</div>
              <div class="hstat-label">知识点</div>
            </div>
            <div class="hstat">
              <div class="hstat-value" id="statDue">0</div>
              <div class="hstat-label">待复习</div>
            </div>
            <div class="hstat">
              <div class="hstat-value" id="statMonths">0</div>
              <div class="hstat-label">记忆月份</div>
            </div>
          </div>
        </section>

        <!-- ===== 复习提醒（遗忘） ===== -->
        <section class="pf-card" id="recallCard">
          <div class="pf-head">
            <div class="pf-title">复习提醒</div>
            <div class="pf-sub">遗忘指数跌破阈值的知识点，建议及时复习</div>
          </div>
          <div class="recall-list" id="recallList">
            <div class="pf-empty">暂无需要复习的知识点</div>
          </div>
        </section>

        <!-- ===== 防遗忘计划状态 ===== -->
        <section class="pf-card" id="planCard">
          <div class="pf-head">
            <div class="pf-title">防遗忘计划</div>
            <div class="pf-sub">到期内容进入左上角通知栏，主动领取后复述解题流程</div>
          </div>
          <div class="plan-body" id="planBody">
            <div class="pf-empty">尚未生成防遗忘计划</div>
          </div>
        </section>

        <!-- ===== 掌握画像（按遗忘优先级） ===== -->
        <section class="pf-card">
          <div class="pf-head">
            <div class="pf-title">掌握画像</div>
            <div class="pf-sub">按遗忘程度排序 · 覆盖你接触过的全部知识点</div>
          </div>
          <div class="mastery-list" id="masteryList">
            <div class="pf-empty">暂无掌握数据，开始解题后这里会逐步生成</div>
          </div>
        </section>

        <!-- ===== 基本信息 ===== -->
        <section class="pf-card">
          <div class="pf-head">
            <div class="pf-title">基本信息</div>
            <div class="pf-sub">你在档案中填写的基础信息</div>
          </div>
          <div class="basic-grid" id="basicGrid">
            <div class="pf-empty">暂无基本信息</div>
          </div>
        </section>

      </div>
    </div>
  </main>

  <!-- toast -->
  <div class="toast" id="toast" hidden></div>
</div>

<script src="chrome.js"></script><script src="profile.js"></script>
</body>
</html>
